*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t);padding-bottom:96px;min-height:100vh}
#app{max-width:720px;margin:auto;padding:16px}
h2{font-size:22px;margin:6px 0 12px;font-weight:800}h3{font-size:16px;margin:18px 0 8px;color:var(--p)}small,.m{color:var(--m);font-size:12px}
.c{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px;margin:10px 0;}.c:active{opacity:.85}
html{touch-action:manipulation;color-scheme:dark}html.lt{color-scheme:light}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{width:100%;background:var(--bt);color:#fff;border:0;border-radius:16px;padding:13px 14px;font:inherit;font-weight:700;flex:1;text-align:center;cursor:pointer;display:block;box-shadow:0 4px 12px rgba(var(--rgb),.2)}
.btn.s{background:rgba(var(--rgb),.1);color:var(--p);border:1px solid rgba(var(--rgb),.33);box-shadow:none;margin:4px 0}
.chip{background:rgba(var(--rgb),.08);color:var(--t);border:1px solid var(--b);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.ic{background:none;border:0;font-size:24px;color:var(--t)}
.top{display:flex;align-items:center;gap:6px}.top h2{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px 8px;text-align:center;font-size:12px;color:var(--m)}.st b{display:block;font-size:28px;color:var(--st)}
.bar{height:8px;background:var(--bar);border-radius:8px;margin:8px 0 3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.tx{white-space:pre-wrap;line-height:1.9;font-size:14px;margin:6px 0}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ph img{width:100%;border-radius:12px;max-height:160px;object-fit:cover}

function lecV(id){const l=g('lec',id);if(!l)return'';const s=g('sub',l.sub),fs=S.file.filter(f=>f.lec==id),au=fs.filter(f=>f.kind=='audio'),ot=fs.filter(f=>f.kind!='audio'),tabs=[['rec','التسجيلات',au.length],['files','الملفات',ot.length],['ai','الذكاء الاصطناعي','']];let b='';

else b=`<div class="row">${Object.entries(AIT).filter(x=>x[0]!='fx').map(([k,v])=>`<button class="chip" style="${tint(AIC[k])}" onclick="aiRun('${id}','${k}')">${v[0]}</button>`).join('')}<button class="chip" style="${tint('#a78bfa')}" onclick="fileAI()">🤖 اسأل عن ملف</button><button class="chip" style="${tint('#ff7a9c')}" onclick="quiz('${id}')">اختبار</button><button class="chip" style="${tint('#ffc15e')}" onclick="mkCards('${id}')">بطاقات</button>${l.cards?`<button class="chip" style="${tint('#ffc15e')}" onclick="study('${id}')">مراجعة (${dueOf([l]).length})</button>`:''}</div>`+(Object.entries(l.ai||{}).map(([k,t])=>`<details open style="${tint(AIC[k])}"><summary>${AIT[k][0]}</summary><p class="tx">${h(t)}</p></details>`).join('')||'<div class="empty">اضغط أي أداة لتحلل المحاضرة</div>');

function doFind(){const q=$('#q').value.trim().toLowerCase(),r=[];if(q.length>1){const has=s=>(s||'').toLowerCase().includes(q);S.sub.forEach(s=>(has(s.name)||has(s.doc))&&r.push(['#sub/'+s.id,' '+s.name]));S.note.forEach(n=>(has(n.title)||has(n.body))&&r.push(['#notes','ملاحظة: '+(n.title||'')]));S.file.forEach(f=>f.sub&&!f.lec&&(has(f.name)||has(f.text)||has(f.cap))&&r.push(['#sub/'+f.sub,'ملف: '+f.name]));S.lec.forEach(l=>(has(l.title)||has(l.notes))&&r.push(['#lec/'+l.id,' '+lbl(l)]));S.file.forEach(f=>{const l=g('lec',f.lec);l&&(has(f.name)||has(f.text)||has(f.cap))&&r.push(['#lec/'+f.lec,(f.kind=='audio'?' ':' ')+lbl(l)+' — '+(f.text?(f.text.slice(Math.max(0,f.text.toLowerCase().indexOf(q)-30),f.text.toLowerCase().indexOf(q)+60)):f.name)])})}$('#res').innerHTML=r.map(x=>`<div class="c" style="${tc(x[0].startsWith('#sub')?g('sub',x[0].slice(5))?.col:lcol(x[0].slice(5)))}" onclick="location.hash='${x[0]}'">${h(x[1])}</div>`).join('')}

<h3>🎨 الثيمات</h3><div class="thg">${THEMES.map(x=>`<button class="thb${(cfg.th||'d')==x[0]?' on':''}" onclick="pickTheme('${x[0]}')"><i style="background:${x[3]}"></i>${x[1]}</button>`).join('')}</div>
