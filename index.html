<style>
:root{--bg:#000;--g:radial-gradient(ellipse at 50% -15%,#0a3a8c 0,#02060f 55%,#000 100%);--c:#0b1220cc;--t:#eaf1ff;--m:#8190ad;--p:#3b82f6;--b:#17233b;--bt:linear-gradient(135deg,#2563eb,#38bdf8)}
[data-th=l]{--bg:#f2f6ff;--g:linear-gradient(#e6efff,#f7faff);--c:#ffffffd9;--t:#10213f;--m:#6b7894;--p:#2563eb;--b:#d5e0f5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Tahoma,sans-serif;background:var(--bg);background-image:var(--g);background-attachment:fixed;color:var(--t);padding-bottom:96px;min-height:100vh}
#app{max-width:720px;margin:auto;padding:16px}
h2{font-size:22px;margin:6px 0 12px;font-weight:800}h3{font-size:16px;margin:18px 0 8px;color:var(--p)}small,.m{color:var(--m);font-size:12px}
.c{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px;margin:10px 0;backdrop-filter:blur(10px);transition:.15s}.c:active{transform:scale(.985)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{width:100%;background:var(--bt);color:#fff;border:0;border-radius:16px;padding:13px 14px;font:inherit;font-weight:700;flex:1;text-align:center;cursor:pointer;display:block;box-shadow:0 8px 24px #2563eb40}
.btn.s{background:#3b82f61a;color:var(--p);border:1px solid #3b82f655;box-shadow:none;margin:4px 0}
.chip{background:#3b82f614;color:var(--t);border:1px solid var(--b);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.ic{background:none;border:0;font-size:24px;color:var(--t)}
.top{display:flex;align-items:center;gap:6px}.top h2{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px 8px;text-align:center;font-size:12px;color:var(--m)}.st b{display:block;font-size:28px;color:#4da3ff}
.bar{height:8px;background:#ffffff14;border-radius:8px;margin:8px 0 3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.tx{white-space:pre-wrap;line-height:1.9;font-size:14px;margin:6px 0}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ph img{width:100%;border-radius:12px;max-height:160px;object-fit:cover}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:14px;background:#3b82f60f;color:var(--t);font:inherit}textarea{min-height:90px}
label{display:block;font-size:13px;margin:10px 0 4px;color:var(--m)}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:12px;max-width:520px;margin:auto;display:flex;background:#0a1220e6;border:1px solid #1d2f52;border-radius:24px;padding:8px 4px;backdrop-filter:blur(16px);box-shadow:0 10px 40px #000a;z-index:5}
[data-th=l] nav{background:#fffffff0}

#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
.sheet{background:#0b1220;color:var(--t);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;border:1px solid var(--b)}
[data-th=l] .sheet{background:#fff}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2563eb;color:#fff;padding:10px 18px;border-radius:14px;display:none;z-index:20;font-size:14px}
#wv{width:100%;height:70px;background:#3b82f60f;border-radius:14px}.big{font-size:38px;text-align:center;font-variant-numeric:tabular-nums;color:var(--p);font-weight:800}
details{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:10px 14px;margin:8px 0}summary{font-weight:700}

<script>
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DB=new Promise(r=>{const q=indexedDB.open('uninote',1);q.onupgradeneeded=()=>['sub','lec','file','sch'].forEach(s=>q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>r(q.result)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((a,b)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>a(o.result);t.onerror=()=>b(t.error)})};
const S={sub:[],lec:[],file:[],sch:[]};
const put=async(s,v)=>{await tx(s,'readwrite',o=>o.put(v));const i=S[s].findIndex(x=>x.id==v.id);i<0?S[s].push(v):S[s][i]=v};
const rm=async(s,id)=>{await tx(s,'readwrite',o=>o.delete(id));S[s]=S[s].filter(x=>x.id!=id)};
const g=(s,id)=>S[s].find(x=>x.id==id);
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)};
const cfg=JSON.parse(localStorage.cfg||'{}'),saveCfg=()=>localStorage.cfg=JSON.stringify(cfg);
document.documentElement.dataset.th=cfg.th||'d';
const tint=c=>`background:${c}22;border-color:${c}66`;
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

async function startRec(lec){if(REC)return toast('في تسجيل شغال');try{
const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000}});

<h3> الإنجاز</h3>${S.sub.map(s=>`<div class="c"><b>${h(s.name)}</b> <small>${prog(s.id)}%</small><div class="bar"><i style="width:${prog(s.id)}%;background:${s.col}"></i></div></div>`).join('')}`}
const subs=()=>`<div class="top"><h2> المواد</h2><button class="ic" onclick="subForm()">＋</button></div>`+(S.sub.map(s=>`<div class="c" style="${tint(s.col)};border-right:6px solid ${s.col}" onclick="location.hash='sub/${s.id}'"><b>${h(s.name)}</b><br><small>${h(s.doc||'')} ${h(s.dept||'')} ${h(s.stage||'')}</small><div class="bar"><i style="width:${prog(s.id)}%;background:${s.col}"></i></div><small>${S.lec.filter(l=>l.sub==s.id).length} محاضرة · ${prog(s.id)}%</small></div>`).join('')||'<p class="m">اضغط ＋ لإضافة أول مادة</p>');
function subV(id){const s=g('sub',id);if(!s)return'';return `<div class="top"><button class="ic" onclick="location.hash='subs'">→</button><h2>${h(s.name)}</h2></div><div class="c"><small>د. ${h(s.doc||'-')} · ${h(s.dept||'-')} · ${h(s.stage||'-')}</small><div class="row"><button class="chip" onclick="subForm('${id}')">تعديل</button><button class="chip" onclick="delSub('${id}')">حذف</button></div></div><button class="btn" onclick="lecForm('${id}')">＋ محاضرة جديدة</button>`+S.lec.filter(l=>l.sub==id).sort((a,b)=>a.num-b.num).map(l=>`<div class="c" style="${tint(COLS[(+l.num||0)%6][0])}" onclick="location.hash='lec/${l.id}'">${l.done?'✓':'○'}${l.star?'★':''} <b>محاضرة ${h(l.num)}</b> ${h(l.title||'')}<br><small>${h(l.date||'')} · تسجيلات ${S.file.filter(f=>f.lec==l.id&&f.kind=='audio').length}</small></div>`).join('')}
function lecV(id){const l=g('lec',id);if(!l)return'';const s=g('sub',l.sub),fs=S.file.filter(f=>f.lec==id),au=fs.filter(f=>f.kind=='audio'),ot=fs.filter(f=>f.kind!='audio');
return `<div class="top"><button class="ic" onclick="location.hash='sub/${s.id}'">→</button><h2>${h(lbl(l))}</h2></div><div class="c"><b>${h(l.title||'')}</b> <small>${h(l.date||'')}</small><p class="tx">${h(l.notes||'لا توجد ملاحظات')}</p><div class="row"><button class="chip" onclick="lecForm('${s.id}','${id}')">تعديل</button><button class="chip" onclick="tog('${id}')">${l.done?'مكتملة ✓':'غير مكتملة'}</button><button class="chip" onclick="star('${id}')">${l.star?'★':'☆'} مهمة</button><button class="chip" onclick="delLec('${id}')">حذف</button></div></div>${recPanel(id)}
<h3> التسجيلات</h3>${au.map(audioCard).join('')||'<p class="m">لا يوجد</p>'}<label class="btn s"> رفع تسجيل من الهاتف<input type="file" accept="audio/*" hidden onchange="addF('${id}',this.files,'audio')"></label>
<h3> الصور والملفات</h3><div class="gal">${ot.map(fileCard).join('')}</div><div class="row"><label class="btn s"> كاميرا<input type="file" accept="image/*" capture="environment" hidden onchange="addF('${id}',this.files)"></label><label class="btn s"> صور / PDF / Word<input type="file" multiple accept="image/*,.pdf,.doc,.docx" hidden onchange="addF('${id}',this.files)"></label></div>
<h3> الذكاء الاصطناعي</h3><div class="row">${Object.entries(AIT).map(([k,v])=>`<button class="chip" onclick="aiRun('${id}','${k}')">${v[0]}</button>`).join('')}<button class="chip" onclick="mkCards('${id}')">بطاقات</button>${l.cards?`<button class="chip" onclick="study('${id}')"> مراجعة</button>`:''}</div>${Object.entries(l.ai||{}).map(([k,t])=>`<details open><summary>${AIT[k][0]}</summary><p class="tx">${h(t)}</p></details>`).join('')}`}
const recs=()=>`<h2> كل التسجيلات</h2>`+(S.file.filter(f=>f.kind=='audio').sort((a,b)=>b.date-a.date).map(f=>`<small>${h(g('lec',f.lec)?lbl(g('lec',f.lec)):'')}</small>`+audioCard(f)).join('')||'<p class="m">ما عندك تسجيلات</p>')+`<button class="btn" style="margin-top:12px" onclick="quickRec()"> تسجيل جديد</button>`;
const sched=()=>`<div class="top"><h2> الجدول</h2><button class="ic" onclick="schForm()">＋</button></div>`+(upcoming().map(a=>schLine(a).replace('</div>',`<button class="chip" onclick="rm('sch','${a[0].id}').then(render)">حذف</button></div>`)).join('')||'<p class="m">اضغط ＋ لإضافة محاضرة أو امتحان أو واجب</p>');
function find(){return `<div class="top"><button class="ic" onclick="history.back()">→</button><h2> بحث وسؤال</h2></div><input id="q" placeholder="ابحث أو اسأل..." oninput="doFind()"><div class="row"><button class="btn" onclick="askAll()"> اسأل الذكاء عن محاضراتي</button></div><p class="tx" id="ans"></p><div id="res"></div>`}
function doFind(){const q=$('#q').value.trim().toLowerCase(),r=[];if(q.length>1){const has=s=>(s||'').toLowerCase().includes(q);S.sub.forEach(s=>(has(s.name)||has(s.doc))&&r.push(['#sub/'+s.id,' '+s.name]));S.lec.forEach(l=>(has(l.title)||has(l.notes))&&r.push(['#lec/'+l.id,' '+lbl(l)]));S.file.forEach(f=>{const l=g('lec',f.lec);l&&(has(f.name)||has(f.text)||has(f.cap))&&r.push(['#lec/'+f.lec,(f.kind=='audio'?' ':' ')+lbl(l)+' — '+(f.text?(f.text.slice(Math.max(0,f.text.toLowerCase().indexOf(q)-30),f.text.toLowerCase().indexOf(q)+60)):f.name)])})}$('#res').innerHTML=r.map(x=>`<div class="c" onclick="location.hash='${x[0]}'">${h(x[1])}</div>`).join('')}
function set(){return `<h2> الإعدادات</h2><div class="c"><label>اسمك</label><input value="${h(cfg.name||'')}" onchange="cfg.name=this.value;saveCfg()"><label>مفتاح Gemini API (للتفريغ والتلخيص)</label><input type="password" value="${h(cfg.key||'')}" onchange="cfg.key=this.value.trim();saveCfg()"><label>موديل Gemini</label><input value="${h(cfg.model||'gemini-2.5-flash')}" onchange="cfg.model=this.value.trim();saveCfg()"></div>
<div class="row"><button class="btn s" onclick="cfg.th=(cfg.th||'d')=='d'?'l':'d';saveCfg();document.documentElement.dataset.th=cfg.th"> الوضع الليلي/النهاري</button><button class="btn s" onclick="Notification.requestPermission().then(p=>toast(p=='granted'?'انفعلت التنبيهات':'مرفوضة'))"> تفعيل التنبيهات</button></div>
<div class="row"><button class="btn s" onclick="expo()"> نسخة احتياطية (بدون الملفات)</button><label class="btn s"> استعادة<input type="file" accept=".json" hidden onchange="impo(this.files[0])"></label></div><p class="m">التسجيلات والصور تنحفظ بالجهاز نفسه وما تنحذف عند التلخيص.</p>`}
function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({sub:S.sub,lec:S.lec,sch:S.sch})]));a.download='uninote-backup.json';a.click()}
async function impo(f){const d=JSON.parse(await f.text());for(const k of['sub','lec','sch'])for(const x of d[k]||[])await put(k,x);toast('تمت الاستعادة');render()}
function render(){const [p,id]=location.hash.slice(1).split('/'),V={home,subs,sub:()=>subV(id),lec:()=>lecV(id),recs,sched,set,find,focus}[p||'home']||home;$('#app').innerHTML=V();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==({sub:'subs',lec:'subs',find:'home',focus:'home'}[p]||p||'home')))}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
(async()=>{for(const k in S)S[k]=await tx(k,'readonly',o=>o.getAll());try{navigator.storage.persist()}catch{}render()})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
